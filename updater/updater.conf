# /etc/ogmfx/updater.conf — OGMFX updater configuration
# Sourced as bash by ogmfx-update.sh; keep it to KEY="value" lines.

# GitHub repo that publishes releases (owner/name).
repo="LuhOli42/OpenGuitarMultiFx"

# Release channel: "stable" tracks /releases/latest;
# "beta" tracks the newest non-draft prerelease.
channel="stable"

# Minimum time between real update checks. The ogmfx-updater.timer fires more
# often; the script skips checks that arrive sooner than this.
# Suffixes: s, m, h, d, w (bare number = seconds).
check_interval="6h"

# Install layout (see docs/Phase6Plan.md — do not change casually, these are
# cross-workstream contracts).
install_root="/opt/ogmfx"           # contains releases/, current, previous
state_dir="/var/lib/ogmfx/state"    # survives updates: logs, bad-versions, locks

# systemd unit the updater restarts and health-checks after an update.
service_name="ogmfx.service"

# Health check: unit must be active health_delay_s after restart and stay
# active through health_grace_s more, else the update rolls back.
health_delay_s=10
health_grace_s=30

# Number of newest releases kept under releases/ (the dirs `current` and
# `previous` point at are always protected regardless).
keep_releases=2

# ---- Advanced / testing ----
# Releases API base. Default: https://api.github.com/repos/$repo
# Override for mirrors or for local testing (e.g. http://127.0.0.1:8000).
#api_base=""

# Optional GitHub token; raises the 60 req/h unauthenticated API rate limit.
#github_token=""

# curl timeouts.
#connect_timeout_s=15
#max_time_s=600
