# Phase 6 W2: CI for both release targets (docs/Phase6Plan.md).
#
# One parametrized pipeline for both arches, per the locked decision in the
# plan: everything builds inside the W1 toolchain image
# (tools/toolchain/Dockerfile) via scripts/cross-build.sh. Each arch leg
# builds the image variant matching matrix.arch — the x86_64 leg uses the
# slim TARGET=x86_64 image (no arm64 sysroot), which is far smaller to
# build and to `load` into the daemon.
#
#   x86_64  — native build in the slim image, native ctest (full suite,
#             run serially: normal suites carry wall-clock perf asserts —
#             realTimeFactor / %CPU bounds — that go flaky under parallel
#             CPU contention).
#   aarch64 — cross build against the image's arm64 sysroot; `ctest` runs
#             each test under qemu-aarch64 automatically (the toolchain
#             file sets CMAKE_CROSSCOMPILING_EMULATOR; qemu-user-static is
#             installed in the image). The "Bench" and "Probe" category
#             suites are SKIPPED (the *_NoPerf.shard* entries): they assert
#             wall-clock real-time bounds that emulation cannot hold. The
#             same applies to perf asserts embedded inside normal suites:
#             OGMFX_TESTS_UNDER_EMULATION (set by the emulator string)
#             makes them log-only there — see Tests/TestEnvironment.h —
#             which is also what makes it safe to run 4 qemu shards in
#             parallel on the 4-vCPU runner. On-device runs of the perf
#             suites are W6's on-board benchmark job.
#
# Caching: the toolchain image layers go through buildx's type=gha cache
# (per-arch scope); the FetchContent sources under build-<arch>/_deps
# (JUCE, Eigen, nlohmann/json, NAM core) go through actions/cache keyed on
# the CMake/dep files; compiled objects are NOT cached — ccache
# (.ccache/, content-addressed) covers them far better: a git checkout
# rewrites every source mtime, so a restored build tree looks fully dirty
# to the build system and would recompile everything anyway.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      # ubuntu-latest runners: 4 vCPU / 16GB. Above the scripts' default of 2,
      # but keep a ceiling — heavy nam_core/Eigen TUs are memory-hungry
      # (see scripts/build.sh for the crash that motivated the cap).
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build toolchain image (layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: tools/toolchain
          build-args: TARGET=${{ matrix.arch }}
          tags: ogmfx-toolchain:latest
          load: true
          cache-from: type=gha,scope=ogmfx-toolchain-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ogmfx-toolchain-${{ matrix.arch }}

      - name: Restore FetchContent deps (JUCE, Eigen, json, NAM)
        uses: actions/cache@v4
        with:
          path: build-${{ matrix.arch }}/_deps
          key: ogmfx-deps-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'Tests/CMakeLists.txt', 'cmake/**', 'tools/toolchain/**') }}
          restore-keys: ogmfx-deps-${{ matrix.arch }}-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ogmfx-ccache-${{ matrix.arch }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ogmfx-ccache-${{ matrix.arch }}-${{ github.ref }}-
            ogmfx-ccache-${{ matrix.arch }}-

      - name: Build ${{ matrix.arch }}
        run: scripts/cross-build.sh ${{ matrix.arch }}

      - name: Test (x86_64, native ctest — full suite, serial)
        if: matrix.arch == 'x86_64'
        run: |
          docker run --rm -v "$PWD:/src" -w /src ogmfx-toolchain:latest \
            ctest --test-dir build-x86_64 --output-on-failure \
                  -R '^OpenGuitarMultiFx_UnitTests$'

      - name: Test (aarch64, qemu — NoPerf suite, 4 parallel shards)
        if: matrix.arch == 'aarch64'
        run: |
          docker run --rm -v "$PWD:/src" -w /src ogmfx-toolchain:latest \
            ctest --test-dir build-aarch64 --output-on-failure \
                  --parallel 4 --timeout 1800 -R 'NoPerf\.shard'

      - name: Verify install() payload (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          docker run --rm -v "$PWD:/src" -w /src ogmfx-toolchain:latest \
            bash -ec '
              rm -rf /tmp/stage
              cmake --install build-x86_64 --prefix /tmp/stage
              for f in bin/OpenGuitarMultiFx systemd/ogmfx.service \
                       systemd/ogmfx-updater.service systemd/ogmfx-updater.timer \
                       install.sh etc/ogmfx/updater.conf; do
                [ -f "/tmp/stage/$f" ] || { echo "missing payload file: $f"; exit 1; }
              done
              echo "install() payload OK"'
