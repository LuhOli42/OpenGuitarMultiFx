# Fast CI gate (~5 min): build both arches + a small smoke test subset.
#
# The full test suite lives in ci-full.yml — it runs on every PR too, but
# as a separate workflow so it never blocks this gate (mark only these
# jobs required in branch protection). The whole-suite qemu run is ~3 h
# of CPU work; no amount of sharding makes it fit in a 5-min gate, so the
# gate's job is: does it still compile on both arches, and do the core
# paths still pass a quick sanity subset.
#
# Each arch leg builds the image variant matching matrix.arch — x86_64
# uses the slim TARGET=x86_64 image (no arm64 sysroot), which is far
# smaller to build and to `load` into the daemon.
#
#   x86_64  — native build + ~8 fast smoke suites (NodalCircuit solver,
#             engine, presets, one amp, one pedal; seconds each natively).
#   aarch64 — cross build + 3 light suites under qemu-aarch64 (engine-
#             level, no solver loops — ~1 min). The smoke alone can't hold
#             wall-clock perf bounds under emulation, so
#             OGMFX_TESTS_UNDER_EMULATION=1 makes them log-only
#             (Tests/TestEnvironment.h).
#
# Caching: image layers via buildx type=gha (per-arch scope); FetchContent
# sources under build-<arch>/_deps via actions/cache; objects via ccache
# (.ccache/, content-addressed — a fresh checkout's mtimes make a restored
# build tree look fully dirty, so tree caching never paid off).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      # ubuntu-latest runners: 4 vCPU / 16GB. Above the scripts' default of 2,
      # but keep a ceiling — heavy nam_core/Eigen TUs are memory-hungry
      # (see scripts/build.sh for the crash that motivated the cap).
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build toolchain image (layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: tools/toolchain
          build-args: TARGET=${{ matrix.arch }}
          tags: ogmfx-toolchain:latest
          load: true
          cache-from: type=gha,scope=ogmfx-toolchain-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ogmfx-toolchain-${{ matrix.arch }}

      - name: Restore FetchContent deps (JUCE, Eigen, json, NAM)
        uses: actions/cache@v4
        with:
          path: build-${{ matrix.arch }}/_deps
          key: ogmfx-deps-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'Tests/CMakeLists.txt', 'cmake/**', 'tools/toolchain/**') }}
          restore-keys: ogmfx-deps-${{ matrix.arch }}-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ogmfx-ccache-${{ matrix.arch }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ogmfx-ccache-${{ matrix.arch }}-${{ github.ref }}-
            ogmfx-ccache-${{ matrix.arch }}-

      - name: Build ${{ matrix.arch }}
        run: scripts/cross-build.sh ${{ matrix.arch }}

      - name: Smoke test (x86_64 — fast core suites)
        if: matrix.arch == 'x86_64'
        run: |
          docker run --rm -v "$PWD:/src" -w /src ogmfx-toolchain:latest \
            ./build-x86_64/Tests/OpenGuitarMultiFx_Tests_artefacts/Release/OpenGuitarMultiFx_Tests \
              SignalGraph DeferredReclaimer ParameterManager PresetManager \
              NodalCircuit OversampledEffect SuperLeadStyleAmplifier \
              TubeScreamerStyleOverdrive

      - name: Smoke test (aarch64 — light suites under qemu)
        if: matrix.arch == 'aarch64'
        run: |
          docker run --rm -v "$PWD:/src" -w /src ogmfx-toolchain:latest \
            qemu-aarch64-static -L /opt/sysroots/aarch64 \
              -E OGMFX_TESTS_UNDER_EMULATION=1 \
              ./build-aarch64/Tests/OpenGuitarMultiFx_Tests_artefacts/Release/OpenGuitarMultiFx_Tests \
                SignalGraph DeferredReclaimer ParameterManager

      - name: Verify install() payload (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          docker run --rm -v "$PWD:/src" -w /src ogmfx-toolchain:latest \
            bash -ec '
              rm -rf /tmp/stage
              cmake --install build-x86_64 --prefix /tmp/stage
              for f in bin/OpenGuitarMultiFx systemd/ogmfx.service \
                       systemd/ogmfx-updater.service systemd/ogmfx-updater.timer \
                       install.sh etc/ogmfx/updater.conf; do
                [ -f "/tmp/stage/$f" ] || { echo "missing payload file: $f"; exit 1; }
              done
              echo "install() payload OK"'
