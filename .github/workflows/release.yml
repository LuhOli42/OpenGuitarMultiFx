# Phase 6 W3: release pipeline (docs/Phase6Plan.md).
#
# Tag push v* -> build both arches through the W1 toolchain image
# (scripts/cross-build.sh) -> scripts/package.sh -> GitHub Release carrying:
#
#   ogmfx-<version>-aarch64.tar.gz (+ .sha256)
#   ogmfx-<version>-x86_64.tar.gz  (+ .sha256)
#   latest.json                    from the aarch64 package — the on-device
#                                  updater checks its tarball_url against
#                                  `uname -m`, so it must point at the
#                                  device arch
#
# A tag that is not a clean vX.Y.Z (e.g. v1.2.3-beta.1) publishes as a
# prerelease on channel "beta" — that is how ogmfx-update.sh's channel
# setting (updater/updater.conf) finds it: stable = /releases/latest,
# beta = newest non-draft prerelease.
#
# Two ways to release:
#   * push a tag (git tag -a v0.1.0-beta.9 -m ... && git push origin v0.1.0-beta.9), or
#   * GitHub -> Actions -> Release -> "Run workflow" -> pick beta or stable: the `tag` job works out the next
#     version from the existing tags (v0.1.0-beta.8 -> v0.1.0-beta.9; stable -> v0.1.0, then v0.1.1, ...), tags the
#     selected branch's head and the same run builds and publishes it. (A tag pushed with the workflow's own token
#     does not start a second run.)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      kind:
        description: "beta = next v<base>-beta.N (what the boards' beta channel installs); stable = v<base> or the next patch"
        type: choice
        options: [beta, stable]
        default: beta

permissions:
  contents: write

env:
  BUILD_JOBS: 4

jobs:
  tag:
    name: next version tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Work out the next tag and push it
        id: next
        env:
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          [ -n "$latest" ] || latest=v0.0.0
          base=${latest%%-*}                       # v0.1.0-beta.8 -> v0.1.0
          if [ "$KIND" = beta ]; then
            n=$(git tag --list "$base-beta.*" | sed 's/.*-beta\.//' | sort -n | tail -n1)
            if git rev-parse -q --verify "refs/tags/$base" >/dev/null; then
              IFS=. read -r ma mi pa <<< "${base#v}"; base="v$ma.$mi.$((pa + 1))"; n=""
            fi
            tag="$base-beta.$(( ${n:-0} + 1 ))"
          else
            tag=$base
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              IFS=. read -r ma mi pa <<< "${base#v}"; tag="v$ma.$mi.$((pa + 1))"
            fi
          fi
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && { echo "::error::$tag already exists"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag (released from the Actions tab)"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Releasing $tag" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: package-${{ matrix.arch }}
    needs: tag
    if: ${{ !cancelled() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
          ref: ${{ needs.tag.outputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      # Same caching scheme as ci.yml (see that file's header): per-arch
      # slim/full toolchain variants, FetchContent _deps via actions/cache,
      # objects via ccache — a tag built right after a main-branch CI run is
      # a near-total cache hit.
      - name: Build toolchain image (layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: tools/toolchain
          build-args: TARGET=${{ matrix.arch }}
          tags: ogmfx-toolchain:latest
          load: true
          cache-from: type=gha,scope=ogmfx-toolchain-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ogmfx-toolchain-${{ matrix.arch }}

      - name: Restore FetchContent deps (JUCE, Eigen, json, NAM)
        uses: actions/cache@v4
        with:
          path: build-${{ matrix.arch }}/_deps
          key: ogmfx-deps-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'Tests/CMakeLists.txt', 'cmake/**', 'tools/toolchain/**') }}
          restore-keys: ogmfx-deps-${{ matrix.arch }}-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ogmfx-ccache-${{ matrix.arch }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ogmfx-ccache-${{ matrix.arch }}-${{ github.ref }}-
            ogmfx-ccache-${{ matrix.arch }}-

      - name: Build ${{ matrix.arch }}
        run: scripts/cross-build.sh ${{ matrix.arch }}

      - name: Channel for this tag
        id: meta
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          REPO: ${{ github.repository }}
        run: scripts/package.sh ${{ matrix.arch }} "$TAG"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/
          retention-days: 7

  publish:
    name: GitHub Release
    needs: [tag, package]
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect assets
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p out
          # Each package.sh run emitted its own latest.json — only the
          # aarch64 one ships as the release's `latest.json` asset: the
          # on-device updater arch-checks its tarball_url against `uname -m`,
          # so it must point at the device arch's tarball.
          cp assets/package-aarch64/*.tar.gz assets/package-aarch64/*.sha256 \
             assets/package-aarch64/latest.json out/
          cp assets/package-x86_64/*.tar.gz assets/package-x86_64/*.sha256 out/
          ( cd out && sha256sum -c ./*.sha256 )
          prerelease=""
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || prerelease="--prerelease"
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            $prerelease
