*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#07080a;color:#e9ecf1;font-family:'Sora',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* ---------- doc chrome (outside the device) ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(7,8,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid #1b1e24;padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.top h1{font-size:15px;font-weight:800;letter-spacing:.2px;margin-right:6px}
.top h1 small{font-weight:400;color:#8a919e;font-size:12px;margin-left:6px}
.seg{display:flex;background:#12141a;border:1px solid #23262e;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 11px;border-radius:7px;font-size:12px;color:#9aa1ad;white-space:nowrap}
.seg button.on{background:#262a33;color:#fff}
.seg.theme button.on{background:#fff;color:#000;font-weight:700}
.lbl{font-size:11px;color:#6d7480;text-transform:uppercase;letter-spacing:1px}
.stage{padding:18px}
.wrap{position:relative;margin:0 auto;max-width:1280px}
.note{max-width:1280px;margin:12px auto 0;font-size:13px;color:#9aa1ad;line-height:1.55}
.note b{color:#e9ecf1}
/* ---------- device ---------- */
.dev{width:1280px;height:800px;transform-origin:0 0;position:absolute;left:0;top:0;overflow:hidden;border-radius:14px;
  background:var(--bg);color:var(--tx);box-shadow:0 0 0 1px #20232a,0 30px 80px rgba(0,0,0,.6);font-family:'Sora',sans-serif}
.dev *{transition:background-color .15s,border-color .15s}
.dev[data-t=stage]{--bg:#0a0b0e;--s1:#121419;--s2:#191c23;--s3:#242833;--ln:rgba(255,255,255,.07);--ln2:rgba(255,255,255,.13);--tx:#f3f5f8;--mu:#8b92a0;--di:#555c69;--r:18px;--rs:12px;--num:'Sora',sans-serif}
.dev[data-t=console]{--bg:#1a1b1e;--s1:#212226;--s2:#2a2b30;--s3:#36373d;--ln:#34353b;--ln2:#45464d;--tx:#e6e6e8;--mu:#9a9ba2;--di:#64656c;--r:5px;--rs:4px;--num:ui-monospace,'DejaVu Sans Mono',monospace}
.dev[data-t=bold]{--bg:#0d0d0d;--s1:#171717;--s2:#202020;--s3:#2c2c2c;--ln:#262626;--ln2:#3a3a3a;--tx:#f5f2ea;--mu:#9b978d;--di:#5d5a54;--r:14px;--rs:10px;--num:'Sora',sans-serif}
.num{font-family:var(--num)}
.dev[data-t=bold] .caps{text-transform:uppercase;letter-spacing:.6px}
.dev[data-t=console] .caps{text-transform:uppercase;letter-spacing:1.2px;font-size:.92em}
/* top bar */
.tb{position:absolute;left:0;right:0;top:0;height:76px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--ln)}
.dev[data-t=stage] .tb{background:linear-gradient(180deg,#101217,#0a0b0e)}
.dev[data-t=console] .tb{background:var(--s1)}
.preset{display:flex;align-items:center;gap:12px;height:56px;padding:0 14px 0 6px;border-radius:var(--rs);min-width:300px;background:var(--s2);border:1px solid var(--ln)}

/* numpad */
.np{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:420px;background:var(--s1);border:1px solid var(--ln2);border-radius:calc(var(--r) + 4px);z-index:31;padding:20px;display:flex;flex-direction:column;gap:12px}
.np .disp{height:72px;border-radius:var(--rs);background:var(--s2);display:flex;align-items:center;justify-content:flex-end;padding:0 18px;font-size:34px;font-weight:800}
.np .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.np .keys button{height:62px;border-radius:var(--rs);background:var(--s2);border:1px solid var(--ln);font-size:22px;font-weight:700}
/* doc page */
.doc{max-width:1180px;margin:0 auto;padding:8px 6px 60px;line-height:1.6;font-size:14px;color:#c9ced6}
.doc h2{font-size:22px;color:#fff;margin:34px 0 10px}
.doc h3{font-size:16px;color:#fff;margin:20px 0 6px}
.doc p{margin:6px 0}
.doc table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.doc th,.doc td{text-align:left;padding:9px 10px;border-bottom:1px solid #1f232a;vertical-align:top}
.doc th{color:#8a919e;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.doc td b{color:#fff}
.dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:12px 0}
.dir{border:1px solid #23262e;border-radius:14px;padding:16px;background:#0e1014}
.dir h3{margin:0 0 4px}
.dir .pal{display:flex;gap:4px;margin:10px 0}
.dir .pal i{flex:1;height:26px;border-radius:5px}
.doc ul,.doc ol{padding-left:20px}.doc li{margin:4px 0}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shots figure{background:#0e1014;border:1px solid #23262e;border-radius:10px;overflow:hidden}
.shots img{width:100%;display:block}
.shots figcaption{font-size:12px;padding:6px 10px;color:#8a919e}
.q{background:#0e1014;border:1px solid #23262e;border-radius:12px;padding:12px 16px;margin:8px 0}
.q b{color:#fff}
</style></head>

function knob(label,v,txt,c){ // v 0..1
 const t=S.theme,a0=-135,a1=135,R=44,cx=55,cy=55;
 const pt=a=>{const r=(a-90)*Math.PI/180;return [cx+R*Math.cos(r),cy+R*Math.sin(r)]};
 const arc=(from,to)=>{const [x0,y0]=pt(from),[x1,y1]=pt(to);return `M${x0} ${y0} A${R} ${R} 0 ${to-from>180?1:0} 1 ${x1} ${y1}`};
 const av=a0+(a1-a0)*v,[px,py]=pt(av);
 let g='';
 if(t==='stage'){g=`<path d="${arc(a0,a1)}" stroke="var(--s3)" stroke-width="8" fill="none" stroke-linecap="round"/><path d="${arc(a0,av)}" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round" style="filter:drop-shadow(0 0 6px ${c})"/><circle cx="55" cy="55" r="31" fill="url(#kg)" stroke="rgba(255,255,255,.08)"/><line x1="55" y1="55" x2="${55+(px-55)*.62}" y2="${55+(py-55)*.62}" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`}
 else if(t==='console'){let ticks='';for(let i=0;i<=10;i++){const a=a0+(a1-a0)*i/10,r=(a-90)*Math.PI/180;ticks+=`<line x1="${55+50*Math.cos(r)}" y1="${55+50*Math.sin(r)}" x2="${55+54*Math.cos(r)}" y2="${55+54*Math.sin(r)}" stroke="var(--di)" stroke-width="1.5"/>`}
  g=`${ticks}<path d="${arc(a0,a1)}" stroke="var(--s3)" stroke-width="4" fill="none"/><path d="${arc(a0,av)}" stroke="${c}" stroke-width="4" fill="none"/><circle cx="55" cy="55" r="33" fill="var(--s2)" stroke="var(--ln2)" stroke-width="1.5"/><line x1="55" y1="55" x2="${55+(px-55)*.7}" y2="${55+(py-55)*.7}" stroke="${c}" stroke-width="3"/>`}
 else {g=`<circle cx="55" cy="55" r="46" fill="var(--s2)"/><path d="${arc(a0,av)}" stroke="${c}" stroke-width="10" fill="none"/><circle cx="55" cy="55" r="30" fill="${c}"/><line x1="55" y1="55" x2="${55+(px-55)*.6}" y2="${55+(py-55)*.6}" stroke="#111" stroke-width="5" stroke-linecap="round"/>`}
 return `<div class="kn"><svg width="110" height="110" viewBox="0 0 110 110"><defs><radialGradient id="kg" cx="40%" cy="30%"><stop offset="0" stop-color="#2d323d"/><stop offset="1" stop-color="#14161b"/></radialGradient></defs>${g}</svg><div class="kl caps">${label}</div><button class="kv num" onclick="S.np=true;draw()">${txt}</button></div>`;
}

const THEMES=[['stage','A · Stage Glass'],['console','B · Console'],['bold','C · Bold Blocks']];

 drawer:'<b>Editar bloco.</b> Bottom sheet sobre o grid (como hoje), mas com cabeçalho único: ícone + nome + categoria, “Trocar modelo”, páginas em abas (Amp / Power / Cab em vez de “Page 2 >”), switch Ligado grande, MIDI, apagar. Knobs 110px com arco na cor da categoria; seletores discretos viram botões empilhados. Toque no valor abre o numpad.',
 add:'<b>Add efeito.</b> Rail de categorias com bolinha de cor + contagem, chips de subcategoria, busca global. Modelos em <b>lista</b>: cada linha tem ícone, nome, descrição curta (pedal/amp original), tag, barrinhas de custo de CPU (CpuCostMap) e botão +. Troque a categoria no rail (Amps, Drive, Reverb têm conteúdo).',
 presets:'<b>Presets.</b> Mesmos 3 modos (Todos / Bancos / Setlists) e “+ Novo” na fila das abas. Tiles mostram número, tag e as cores dos snapshots do preset. Banco = 8 tiles grandes no layout dos footswitches. Setlist = modo palco com anterior/próximo enormes.',
 snap:'<b>Snapshot (segurar).</b> Vira um card próprio em vez de PopupMenu: nome, cor (8 + custom), CC do footswitch, copiar/salvar sobre/apagar.',

 eq:'<b>Master EQ.</b> Mesmo modelo FabFilter de hoje (nós numerados, curva somada), com grade de frequência/dB visível, adicionar banda numa fila só e a banda selecionada no rodapé com sliders grandes.',
 settings:'<b>Ajustes.</b> Continua sendo a única tela de settings, com navegação lateral por seção. A primeira é <b>Aparência</b>: o usuário escolhe entre os 3 temas (toque no card troca o app inteiro na hora) e fica salvo no aparelho.',

 live:'<b>Live — proposta nova.</b> Tela de palco (inspirada no Stomp/Scene mode do Quad Cortex e no Performance view do Helix): preset gigante + 8 botões espelhando os footswitches da fase 8. Opcional — me diz se entra.'

function go(p){S.page=p;S.np=false;draw();window.scrollTo({top:0})}
function devHTML(){

 if(p==='drawer') h+=drawer();

 if(p==='presets') h+=presetsCard();

function doc(){
 const sh=Object.keys(SHOTS);
 return `<div class="doc">
 <h2>Hoje</h2><p>O visual atual nasceu como chain builder de dev: cinzas quase pretos (#141414/#1a1a1a/#262626), um azul de acento (#42a2c8) trocado pela cor do snapshot, contorno colorido nos blocos (referência Quad Cortex), botões JUCE quase padrão e várias legendas de texto (“tap: recall — hold: edit”). Funciona, mas cada tela tem um estilo um pouco diferente e nada é “sistema”.</p>
 ${sh.length?`<div class="shots">${sh.map(k=>`<figure><img src="${SHOTS[k]}"><figcaption>${k.replace(/^\d+-/,'')}</figcaption></figure>`).join('')}</div>`:''}
 <h2>Referências de mercado</h2>
 <table><tr><th>Produto</th><th>O que vale pegar</th><th>O que evitar</th></tr>
 <tr><td><b>Neural DSP Quad Cortex</b> (touch 7")</td><td>Grid 4×8 limpo, blocos com cor de categoria, cenas, modo Stomp/Scene pra palco, gestos (segurar = opções)</td><td>Texto pequeno, muita coisa escondida em long-press</td></tr>
 <tr><td><b>Line 6 Helix / HX Edit</b></td><td>Cor por categoria consistente, scribble strips coloridas, inspector embaixo com páginas, snapshots nomeados</td><td>Cinza datado, densidade de desktop</td></tr>
 <tr><td><b>Fractal FM9 / Axe-Edit III</b></td><td>Leituras numéricas precisas (dB, ms, Hz), grid profundo</td><td>Complexidade, menus em camadas</td></tr>
 <tr><td><b>Boss GX-100 / Hotone Ampero II Stage / Headrush Prime</b></td><td>Touch de chão: tiles grandes, tela de performance com preset gigante</td><td>Pedal foto-realista (skeuomorfismo), fontes de sistema</td></tr>
 <tr><td><b>Kemper Stage / Player</b></td><td>LEDs coloridos por módulo = estado lido de longe</td><td>UI de texto monocromática</td></tr>
 <tr><td><b>Positive Grid Spark / BIAS FX 2, UAFX app</b></td><td>Sensação de “app moderno”: cards, sheets, glow sutil</td><td>Gradientes exagerados, visual de jogo</td></tr>
 <tr><td><b>FabFilter Pro-Q 3</b></td><td>EQ com nós numerados, curva somada, grade discreta</td><td>—</td></tr>
 <tr><td><b>Teenage Engineering OP-1 / Elektron</b></td><td>Color-blocking, tipografia forte, cada cor = uma função</td><td>Ícones crípticos</td></tr>
 </table>
 <h2>3 direções</h2><p>Mesmo layout nas três; muda a pele (cores, raio, blocos, knobs, tipografia de números). Troque no topo e navegue pelas telas.</p>
 <div class="dirs">
  <div class="dir"><h3>A · Stage Glass</h3><div class="pal"><i style="background:#0a0b0e"></i><i style="background:#121419"></i><i style="background:#191c23"></i><i style="background:#242833"></i><i style="background:#f3f5f8"></i><i style="background:#FF851B"></i></div><p>Quad Cortex + app iOS. Preto azulado, cards em degradê leve, raio 18, ícone na cor da categoria com brilho, ponto “LED”. Knob de arco grosso com glow. Mais premium/moderno.</p></div>
  <div class="dir"><h3>B · Console</h3><div class="pal"><i style="background:#1a1b1e"></i><i style="background:#212226"></i><i style="background:#2a2b30"></i><i style="background:#36373d"></i><i style="background:#e6e6e8"></i><i style="background:#4C8DFF"></i></div><p>Helix/Ableton. Grafite flat, raio 4, faixa de cor no topo do bloco (scribble strip), labels em CAIXA ALTA, números em mono, knob fino com escala. Mais técnico e denso, leitura máxima.</p></div>
  <div class="dir"><h3>C · Bold Blocks</h3><div class="pal"><i style="background:#0d0d0d"></i><i style="background:#171717"></i><i style="background:#202020"></i><i style="background:#F6C343"></i><i style="background:#FF6A3D"></i><i style="background:#A77BFF"></i></div><p>Teenage Engineering/Boss. Blocos preenchidos com a cor da categoria e ícone preto; bypass = só contorno. Knob sólido. O mais diferente e o mais legível de longe; menos “sóbrio”.</p></div>
 </div>
 <h2>O que muda em qualquer direção</h2><ul>
 <li><b>Design tokens</b>: uma tabela de cores/raios/espaços em <code>OpenGuitarMultiFxLookAndFeel</code> (hoje são 34 cores hex diferentes espalhadas em 22 arquivos de Source/UI).</li>
 <li><b>Paleta de categoria nova</b>, mais saturada e separada (drive amarelo, dist laranja, fuzz coral, amp laranja-vermelho, dinâmica vermelho-rosa, mod roxo, delay azul, reverb ciano, pitch verde, filtro lima, neural magenta).</li>

function draw(){
 document.getElementById('themes').innerHTML=THEMES.map(([k,n])=>`<button class="${S.theme===k?'on':''}" onclick="S.theme='${k}';draw()">${n}</button>`).join('');
 document.getElementById('pages').innerHTML=PAGES.map(([k,n])=>`<button class="${S.page===k?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
 const dev=document.getElementById('dev'),wrap=document.getElementById('wrap'),dr=document.getElementById('docroot'),nt=document.getElementById('note');
 if(S.page==='plan'){wrap.style.display='none';nt.style.display='none';dr.innerHTML=doc();return}
 wrap.style.display='';nt.style.display='';dr.innerHTML='';
 dev.dataset.t=S.theme;dev.style.setProperty('--acc',acc());dev.innerHTML=devHTML();nt.innerHTML=NOTES[S.page]||'';fit();
}
function fit(){const w=document.getElementById('wrap'),s=Math.min(1,(window.innerWidth-36)/1280);document.getElementById('dev').style.transform=`scale(${s})`;w.style.height=(800*s)+'px';w.style.width=(1280*s)+'px'}
window.addEventListener('resize',fit);
const qp=new URLSearchParams(location.search);if(qp.get('t'))S.theme=qp.get('t');if(qp.get('p'))S.page=qp.get('p');
draw();
